[package]
name = "nettoyage-disque"
version = "0.1.1"
edition = "2021"
description = "Analyse le dossier personnel et place les fichiers inutiles dans la Corbeille, depuis une page locale."
license = "MIT"
repository = "https://github.com/DG-Elom/nettoyage-disque"
readme = "README.md"

[dependencies]
dirs = "6"
fs2 = "0.4"
getrandom = "0.2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
trash = "5"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
